<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskPilot</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main><header><div><p class="eyebrow">YOUR PLANNER</p><h1>TaskPilot</h1><p class="sub">Keep exams, learning, and projects moving forward.</p></div><button id="notify" class="secondary">Enable reminders</button></header>
<section class="summary"><article><span>Open tasks</span><strong id="openCount">0</strong></article><article><span>Due today</span><strong id="todayCount">0</strong></article><article><span>Completed</span><strong id="doneCount">0</strong></article></section>
<section class="layout"><form id="taskForm" class="card"><h2>Add a plan</h2><label>What needs doing?<input name="title" required maxlength="160" placeholder="e.g. Review calculus notes"></label><label>Notes<textarea name="notes" placeholder="A quick note or next step"></textarea></label><div class="twocol"><label>Area<select name="category"><option>Exam</option><option>Learning</option><option>Project</option><option selected>Personal</option></select></label><label>Priority<select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label></div><label>Due date and time<input name="dueAt" type="datetime-local"></label><label>Reminder<input name="remindAt" type="datetime-local"></label><button type="submit">Add task</button><p id="formError" role="alert"></p></form>
<section class="tasks"><div class="taskHead"><h2>Your plans</h2><select id="filter"><option value="all">All tasks</option><option value="active">Active</option><option value="completed">Completed</option></select></div><div id="taskList"></div></section></section></main><template id="taskTemplate"><article class="task card"><button class="check" title="Mark complete"></button><div class="taskBody"><div class="taskTop"><h3></h3><button class="delete" title="Delete task">×</button></div><p class="notes"></p><div class="chips"><span class="category"></span><span class="priority"></span><span class="due"></span></div></div></article></template><script src="app.js"></script></body></html>
